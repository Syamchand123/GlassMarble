# ─────────────────────────────────────────────────────────────────────────────
# GlassMarble CI & Quality Gates
#
# Runs on every push to the main/feature branches and every pull request:
#  1. Compile every package (go build ./...)
#  2. Static analysis (go vet)
#  3. Full unit/integration/e2e test suite (go test ./...)
#  4. AKG determinism gate (the persisted graph must be byte-stable)
#  5. End-to-end smoke against the real gmb binary: analyze → status → doctor
#
# Go toolchain: go.mod requires go 1.22. The tree-sitter grammars are the
# pure-Go bindings (github.com/tree-sitter/go-tree-sitter), so CGO is NOT required.
# ─────────────────────────────────────────────────────────────────────────────

name: GlassMarble CI & Quality Gates

on:
  push:
    branches: [main, feature/overhaul]
  pull_request:
    branches: [main, feature/overhaul]

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.22"

jobs:
  quality-gates:
    name: Quality Gates & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify module integrity
        run: go mod verify

      - name: Compile all packages
        run: go build ./...

      - name: Vet codebase
        run: go vet ./...

      - name: Unit, integration & e2e test suite
        run: go test ./... -count=1 -timeout 30m

      - name: AKG determinism gate
        run: go test ./internal/akg/... -run Deterministic -count=1 -v

      - name: Build gmb binary
        run: go build -o gmb .

      - name: End-to-end smoke (analyze → status → doctor)
        run: |
          ./gmb version
          ./gmb analyze --dir . --intelligence=false --json
          ./gmb status --dir .
          ./gmb doctor --dir .
