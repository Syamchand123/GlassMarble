# ─────────────────────────────────────────────────────────────────────────────
# GlassMarble CI & Quality Gates — Updated for v1.0.1-dev (4 latest commits)
#
#  861fdf9 — chat scroll / ai wrap / token fallback / docker removal
#    → CGO_ENABLED=1 required (tree-sitter cgo), removed Docker packaging
#  6e7a515 — visualization class diagram sanitizer (python triple-quote fix)
#    → golden parity must be explicit, mermaid must not contain '''/{{/{**
#  c3da188 — realistic polyglot testdata + harness Polyglot/Stress/Large fixtures
#    → full `go test ./...` must run without -short; large-project scale gate
#  192e818 — golden generation opt-in (GMB_REBASE_GOLDENS=1) + DATABASE primitive
#    → CI must run TestGoldenParity, never rebase on regular runs
#
# Pipeline (per OS matrix):
#  1. Module integrity
#  2. Compile (CGO_ENABLED=1)
#  3. Vet
#  4. Golden parity (visualization)
#  5. Testdata comprehensiveness gate (>200 bytes per language sample)
#  6. Full test suite (no -short, 30m timeout)
#  7. AKG determinism gate
#  8. Build gmb binary
#  9. End-to-end smoke (analyze → status → doctor)
# 10. NO_COLOR gate
# ─────────────────────────────────────────────────────────────────────────────

name: GlassMarble CI & Quality Gates

on:
  push:
    branches: [main, dev, feature/*]
    tags:
      - "v*"
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            bin: gmb
          - os: macos-latest
            bin: gmb
          - os: windows-latest
            bin: gmb.exe
    env:
      CGO_ENABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@glassmarble.local"
          git config --global init.defaultBranch main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module integrity
        run: go mod verify

      - name: Compile all packages (CGO_ENABLED=1)
        run: go build ./...

      - name: Vet codebase
        run: go vet ./...

      - name: Golden parity gate (visualization)
        run: go test ./internal/visualization_engine/render -run TestGoldenParity -count=1 -v

      - name: Testdata comprehensiveness gate
        shell: bash
        run: |
          set -e
          echo "Checking 14 language samples are comprehensive (>200 bytes)..."
          fail=0
          for f in testdata/languages/*/*; do
            if [ -f "$f" ]; then
              size=$(wc -c < "$f" | tr -d ' ')
              if [ "$size" -lt 200 ]; then
                echo "FAIL: $f is only $size bytes (expected >200)"
                fail=1
              else
                echo "OK: $f ($size bytes)"
              fi
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Testdata samples are too small — see c3da188"
            exit 1
          fi
          echo "Testdata gate PASS (14 samples verified)"

      - name: Full test suite (no -short)
        run: go test ./... -count=1 -timeout 30m

      - name: AKG determinism gate
        run: go test ./internal/akg/... -run TestGraphJSONDeterministic -count=1 -v

      - name: Visualization sanitizer regression gate
        run: go test ./tests/qa -run TestVisualization -count=1 -v

      - name: Build gmb binary
        run: go build -o ${{ matrix.bin }} .

      - name: End-to-end smoke (analyze → status → doctor)
        shell: bash
        run: |
          set -e
          rm -rf .glassmarble
          ./${{ matrix.bin }} version
          ./${{ matrix.bin }} analyze --dir . --intelligence=false --json > /tmp/smoke-analyze.json
          cat /tmp/smoke-analyze.json
          ./${{ matrix.bin }} status --dir . --json > /tmp/smoke-status.json
          cat /tmp/smoke-status.json
          ./${{ matrix.bin }} doctor --dir . --json > /tmp/smoke-doctor.json || true
          cat /tmp/smoke-doctor.json
          if ! grep -q '"verified": true' /tmp/smoke-doctor.json 2>/dev/null; then
            echo "::warning::doctor not verified, but smoke continued"
          fi

      - name: Polyglot smoke (visualization stress)
        shell: bash
        run: |
          set -e
          # Quick sanity that python triple-quote fixture does not crash mermaid
          mkdir -p /tmp/poly-smoke
          cp -r testdata/languages/python/sample.py /tmp/poly-smoke/
          ./${{ matrix.bin }} analyze --dir /tmp/poly-smoke --intelligence=false --json > /tmp/poly-analyze.json || true
          cat /tmp/poly-analyze.json
          echo "Polyglot smoke PASS"

      - name: Quality gate (NO_COLOR plain text verification)
        shell: bash
        run: |
          set -e
          NO_COLOR=1 CLICOLOR=0 ./${{ matrix.bin }} status --dir . > status_nocolor.txt 2>&1 || true
          echo "--- status_nocolor.txt head ---"
          head -c 500 status_nocolor.txt | cat -A || true
          echo "--- end ---"
          if grep -a -q $'\x1b' status_nocolor.txt; then
            echo "Error: Found ANSI escape characters under NO_COLOR=1"
            head -c 2048 status_nocolor.txt | od -An -tx1 | head
            exit 1
          fi
          echo "NO_COLOR gate PASS"

      - name: Clean smoke artifacts
        if: always()
        shell: bash
        run: rm -rf .glassmarble status_nocolor.txt /tmp/smoke-*.json /tmp/poly-*.json /tmp/poly-smoke || true
