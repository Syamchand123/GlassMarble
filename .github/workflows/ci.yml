# ─────────────────────────────────────────────────────────────────────────────
# GlassMarble CI & Quality Gates
#
# Runs on every push to main/feature branches and every pull request across
# Linux, macOS, and Windows runners:
#  1. Module integrity check
#  2. Compile all packages across OS matrix
#  3. Static analysis & vet
#  4. Full test suite with AKG determinism gate
#  5. End-to-end smoke verification
# ─────────────────────────────────────────────────────────────────────────────

name: GlassMarble CI & Quality Gates

on:
  push:
    branches: [main, refactor/packaging, feature/*]
  pull_request:
    branches: [main, refactor/packaging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module integrity
        run: go mod verify

      - name: Compile all packages
        run: go build ./...

      - name: Vet codebase
        run: go vet ./...

      - name: Unit & integration test suite
        run: go test ./... -count=1 -timeout 30m

      - name: AKG determinism gate
        run: go test ./internal/akg/... -run Deterministic -count=1 -v

      - name: Build gmb binary
        run: go build -o gmb${{ matrix.os == 'windows-latest' && '.exe' || '' }} .

      - name: End-to-end smoke (analyze → status → doctor)
        shell: bash
        run: |
          ./gmb${{ matrix.os == 'windows-latest' && '.exe' || '' }} version
          ./gmb${{ matrix.os == 'windows-latest' && '.exe' || '' }} analyze --dir . --intelligence=false --json
          ./gmb${{ matrix.os == 'windows-latest' && '.exe' || '' }} status --dir .
          ./gmb${{ matrix.os == 'windows-latest' && '.exe' || '' }} doctor --dir .

      - name: Quality gate (NO_COLOR plain text verification)
        shell: bash
        run: |
          NO_COLOR=1 ./gmb${{ matrix.os == 'windows-latest' && '.exe' || '' }} status --dir . > status_nocolor.txt
          if grep -q $'\x1b' status_nocolor.txt; then
            echo "Error: Found ANSI escape characters under NO_COLOR=1"
            exit 1
          fi

