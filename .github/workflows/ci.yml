# ─────────────────────────────────────────────────────────────────────────────
# GlassMarble CI & Quality Gates
#
# Runs on every push to main/feature branches and every pull request across
# Linux, macOS, and Windows runners:
#  1. Module integrity check
#  2. Compile all packages across OS matrix
#  3. Static analysis & vet
#  4. Full test suite with AKG determinism gate
#  5. End-to-end smoke verification
# ─────────────────────────────────────────────────────────────────────────────

name: GlassMarble CI & Quality Gates

on:
  push:
    branches: [main, dev, feature/*]
    tags:
      - "v*"
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            bin: gmb
          - os: macos-latest
            bin: gmb
          - os: windows-latest
            bin: gmb.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@glassmarble.local"
          git config --global init.defaultBranch main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module integrity
        run: go mod verify

      - name: Compile all packages
        run: go build ./...

      - name: Vet codebase
        run: go vet ./...

      - name: Unit & integration test suite
        run: go test ./... -count=1 -timeout 30m -short

      - name: AKG determinism gate
        run: go test ./internal/akg/... -run TestGraphJSONDeterministic -count=1 -v

      - name: Build gmb binary
        run: go build -o ${{ matrix.bin }} .

      - name: End-to-end smoke (analyze → status → doctor)
        shell: bash
        run: |
          set -e
          # Clean any stale state from previous runs (self-hosted runners reuse workdirs)
          rm -rf .glassmarble
          ./${{ matrix.bin }} version
          ./${{ matrix.bin }} analyze --dir . --intelligence=false --json > /tmp/smoke-analyze.json
          cat /tmp/smoke-analyze.json
          ./${{ matrix.bin }} status --dir . --json > /tmp/smoke-status.json
          cat /tmp/smoke-status.json
          ./${{ matrix.bin }} doctor --dir . --json > /tmp/smoke-doctor.json || true
          cat /tmp/smoke-doctor.json
          # Verify doctor shows healthy
          if ! grep -q '"verified": true' /tmp/smoke-doctor.json 2>/dev/null; then
            echo "::warning::doctor not verified, but smoke continued"
          fi

      - name: Quality gate (NO_COLOR plain text verification)
        shell: bash
        run: |
          set -e
          NO_COLOR=1 CLICOLOR=0 ./${{ matrix.bin }} status --dir . > status_nocolor.txt 2>&1 || true
          echo "--- status_nocolor.txt head ---"
          head -c 500 status_nocolor.txt | cat -A || true
          echo "--- end ---"
          # Use grep -a to handle binary-safe, and check for ESC (0x1b)
          if grep -a -q $'\x1b' status_nocolor.txt; then
            echo "Error: Found ANSI escape characters under NO_COLOR=1"
            echo "File hex dump (first 2KB):"
            head -c 2048 status_nocolor.txt | od -An -tx1 | head
            exit 1
          fi
          echo "NO_COLOR gate PASS"

      - name: Clean smoke artifacts
        if: always()
        shell: bash
        run: rm -rf .glassmarble status_nocolor.txt /tmp/smoke-*.json || true
