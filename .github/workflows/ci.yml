name: GlassMarble CI & Quality Gates

on:
  push:
    branches: [ main, overhaul ]
  pull_request:
    branches: [ main, overhaul ]

jobs:
  quality-gates:
    name: Quality Gates & Test Pyramid (§13.4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Vet Codebase
        run: go vet ./...

      - name: Unit & Integration Test Suite
        run: go test ./... -v -count=1

      - name: AKG Determinism Test (§13.2)
        run: go test ./internal/akg/... -run Determinism -v

      - name: Pipeline Performance Benchmark Gate (§12.2 / §13.4)
        run: go run main.go analyze --bench

      - name: Validate Golden Fixture Syntax (when toolchain present)
        run: |
          if command -v mmdc >/dev/null 2>&1; then
            echo "Running mermaid-cli validation..."
            for f in internal/visualization_engine/testdata/golden/*.mmd; do
              [ -e "$f" ] || continue
              mmdc -i "$f" -o /tmp/out.svg || exit 1
            done
          else
            echo "mmdc not found; skipping SVG rendering pass."
          fi
