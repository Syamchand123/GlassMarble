# ─────────────────────────────────────────────────────────────────────────────
# GlassMarble AKG PR Architecture Comment
#
# On every pull request this workflow:
#  1. Checks out the merge-base commit and runs `gmb analyze` to build the
#     base Architecture Knowledge Graph snapshot.
#  2. Checks out the PR head and runs `gmb analyze` on the new code.
#  3. Exports both snapshots to GraphJSON via `gmb export`.
#  4. Diffs them with `gmb compare --json`.
#  5. Posts (or updates) a pull-request comment with a human-readable
#     architecture-change summary.
#
# The comment is idempotent: a second push to the same PR branch re-uses the
# existing comment rather than creating a new one.
#
# Tree-sitter grammars use cgo bindings (C parsers wrapped via cgo).
# CGO must be enabled (default). go.mod is the single source of
# truth for the toolchain — workflows use go-version-file: go.mod.
# ─────────────────────────────────────────────────────────────────────────────

name: GlassMarble AKG PR Architecture Comment

on:
  pull_request:
    branches: [main, master, dev]
    types: [opened, synchronize, reopened]

# Cancel any in-progress run for the same PR to avoid stale comments.
concurrency:
  group: akg-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:

  akg-diff:
      # ── Checkout ────────────────────────────────────────────────────────────
      # fetch-depth: 0 is required so git worktree can check out the merge-base.
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git for worktree
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@glassmarble.local"

      # ── Go toolchain (pinned to go.mod) ─────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      # ── Build gmb ───────────────────────────────────────────────────────────
      - name: Build gmb binary
        run: |
          go build -o "$GITHUB_WORKSPACE/gmb" .
          chmod +x "$GITHUB_WORKSPACE/gmb"
          "$GITHUB_WORKSPACE/gmb" version

      # ── Base snapshot (merge-base commit) ──────────────────────────────────
      # Use git worktree to analyse the merge-base without discarding the
      # PR head checkout.  The binary compiled above (from the PR head) is
      # used to analyse both sides so there's no version mismatch.
      # --intelligence=false keeps the snapshot structural: the comment only
      # needs the node/edge delta, and intelligence adds minutes of work.
      - name: Compute merge-base SHA
        id: base
        run: |
          set -e
          # Ensure base branch is fetched (forked PRs may not have it)
          git fetch origin "${{ github.base_ref }}" --depth=50 || git fetch origin --depth=50
          BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null || git merge-base "origin/main" HEAD 2>/dev/null || echo "")
          if [ -z "$BASE_SHA" ]; then
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not compute merge-base, will skip base analysis"
          else
            echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "Merge-base: $BASE_SHA"
          fi

      - name: Analyse base snapshot (merge-base)
        if: steps.base.outputs.sha != ''
        run: |
          set -e
          rm -rf /tmp/gm-base
          git worktree add --detach /tmp/gm-base "${{ steps.base.outputs.sha }}"
          cd /tmp/gm-base
          # Analyse; soft-failure so partial graphs still produce a diff
          set +e
          "$GITHUB_WORKSPACE/gmb" analyze --dir . --full --intelligence=false --json \
            > /tmp/base-analysis.json 2>&1
          ANALYZE_RC=$?
          set -e
          if [ $ANALYZE_RC -ne 0 ]; then
            echo "::warning::Base analysis exited $ANALYZE_RC (partial graph may be used)"
            cat /tmp/base-analysis.json || true
          fi
          "$GITHUB_WORKSPACE/gmb" export --dir . --output /tmp/base.json 2>&1 || \
            echo "::warning::Base export failed — diff will show all head symbols as new"
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/gm-base || true
          rm -rf /tmp/gm-base

      - name: Analyse base fallback (no merge-base)
        if: steps.base.outputs.sha == ''
        run: |
          echo '{"base_commit":"(unavailable)","head_commit":"(unavailable)","nodes_added":[],"nodes_removed":[],"edges_added":[],"edges_removed":[],"files_changed":[]}' > /tmp/base.json
          echo "::warning::Skipped base analysis due to missing merge-base"

      # ── Head snapshot (PR branch) ──────────────────────────────────────────
      - name: Analyse head snapshot (PR branch)
        run: |
          set -e
          rm -rf .glassmarble
          "$GITHUB_WORKSPACE/gmb" analyze --dir . --full --intelligence=false --json \
            > /tmp/head-analysis.json 2>&1 || \
            echo "::warning::Head analysis completed with errors (partial graph may be used)"
          cat /tmp/head-analysis.json || true
          "$GITHUB_WORKSPACE/gmb" export --dir . --output /tmp/head.json 2>&1 || \
            echo "::warning::Head export failed — diff will be empty"
          # Clean up large .glassmarble to save runner disk
          rm -rf .glassmarble || true

      # ── Compute architectural diff ─────────────────────────────────────────
      # Write a safe JSON file; if gmb compare itself fails we fall back to an
      # empty diff object.  The payload is written to a temp file and read via
      # the artifact upload path to avoid the shell-injection risk of embedding
      # arbitrary JSON into a GitHub Actions expression.
      - name: Compute architectural diff (gmb compare)
        id: diff
        run: |
          set -e
          DIFF_FILE=/tmp/diff.json

          if [ -f /tmp/base.json ] && [ -f /tmp/head.json ]; then
            if "$GITHUB_WORKSPACE/gmb" compare /tmp/base.json /tmp/head.json --json \
              > "$DIFF_FILE" 2>&1; then
              echo "Compare succeeded"
            else
              echo "::warning::gmb compare exited non-zero; using partial diff"
              cat "$DIFF_FILE" || true
              # Ensure file is still valid JSON, fallback if not
              if ! python3 -c "import json; json.load(open('$DIFF_FILE'))" 2>/dev/null; then
                cat > "$DIFF_FILE" <<'EOF'
          {"base_commit":"(unavailable)","head_commit":"(unavailable)","nodes_added":[],"nodes_removed":[],"edges_added":[],"edges_removed":[],"files_changed":[]}
          EOF
              fi
            fi
          else
            # Emit a well-formed empty diff so the comment step always runs.
            cat > "$DIFF_FILE" <<'EOF'
          {"base_commit":"(unavailable)","head_commit":"(unavailable)","nodes_added":[],"nodes_removed":[],"edges_added":[],"edges_removed":[],"files_changed":[]}
          EOF
          fi

          # Validate the output is parseable JSON before proceeding.
          python3 -c "import json; json.load(open('/tmp/diff.json'))" \
            || ( echo "::error::diff.json is not valid JSON"; cat "/tmp/diff.json"; exit 1 )
          echo "Diff validated, size: $(wc -c < /tmp/diff.json) bytes"

      # Upload the raw diff JSON as an artifact for debugging / downstream use.
      - name: Upload diff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akg-diff-pr-${{ github.event.pull_request.number }}
          path: /tmp/diff.json
          retention-days: 14
          if-no-files-found: warn

      # ── Post PR comment ────────────────────────────────────────────────────
      # The diff JSON is read from the uploaded file inside the script rather
      # than via a GitHub output variable, which avoids shell-injection when the
      # JSON contains special characters.
      - name: Post (or update) PR architecture comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // ── Parse diff ────────────────────────────────────────────────
            let diff = {};
            try {
              diff = JSON.parse(fs.readFileSync('/tmp/diff.json', 'utf8'));
            } catch (e) {
              console.error('Could not parse diff.json:', e.message);
              diff = {
                base_commit: '(parse error)',
                head_commit: '(parse error)',
                nodes_added: [],
                nodes_removed: [],
                edges_added: [],
                edges_removed: [],
                files_changed: [],
              };
            }

            // ── Helpers ───────────────────────────────────────────────────
            const nodesAdded   = Array.isArray(diff.nodes_added)   ? diff.nodes_added   : [];
            const nodesRemoved = Array.isArray(diff.nodes_removed)  ? diff.nodes_removed : [];
            const edgesAdded   = Array.isArray(diff.edges_added)    ? diff.edges_added   : [];
            const edgesRemoved = Array.isArray(diff.edges_removed)  ? diff.edges_removed : [];
            const files        = Array.isArray(diff.files_changed)  ? diff.files_changed : [];

            const baseCommit = (diff.base_commit || '(none)').substring(0, 12);
            const headCommit = (diff.head_commit || '(none)').substring(0, 12);

            const noChanges =
              !nodesAdded.length && !nodesRemoved.length &&
              !edgesAdded.length && !edgesRemoved.length && !files.length;

            // ── Build comment body ─────────────────────────────────────────
            const MARKER = '<!-- glassmarble-akg-diff -->';
            const lines = [MARKER];

            lines.push('## 🏗️ GlassMarble — Architecture Knowledge Graph Diff');
            lines.push('');
            lines.push(`Base \`${baseCommit}\` → Head \`${headCommit}\``);
            lines.push('');

            // Summary table
            lines.push('| Metric | Count |');
            lines.push('| :--- | ---: |');
            lines.push(`| 🟢 Nodes added    | **${nodesAdded.length}** |`);
            lines.push(`| 🔴 Nodes removed  | **${nodesRemoved.length}** |`);
            lines.push(`| ➕ Edges added    | **${edgesAdded.length}** |`);
            lines.push(`| ➖ Edges removed  | **${edgesRemoved.length}** |`);
            lines.push(`| 📁 Files changed  | **${files.length}** |`);
            lines.push('');

            if (noChanges) {
              lines.push('> ✅ No architectural changes detected between base and head.');
            }

            // ── Added nodes ───────────────────────────────────────────────
            const MAX_NODES = 30;
            if (nodesAdded.length) {
              const shown = nodesAdded.slice(0, MAX_NODES);
              const overflow = nodesAdded.length - shown.length;
              lines.push('<details>');
              lines.push(`<summary><b>🟢 Added symbols (${nodesAdded.length})</b></summary>`);
              lines.push('');
              lines.push('```text');
              for (const n of shown) {
                const file = (n.file || '?').replace(/^.*\//, '');
                lines.push(`+ ${n.id || n.ID || '?'} [${n.kind || n.Kind || '?'}] (${file})`);
              }
              if (overflow > 0) lines.push(`… and ${overflow} more`);
              lines.push('```');
              lines.push('</details>');
              lines.push('');
            }

            // ── Removed nodes ─────────────────────────────────────────────
            if (nodesRemoved.length) {
              const shown = nodesRemoved.slice(0, MAX_NODES);
              const overflow = nodesRemoved.length - shown.length;
              lines.push('<details>');
              lines.push(`<summary><b>🔴 Removed symbols (${nodesRemoved.length})</b></summary>`);
              lines.push('');
              lines.push('```text');
              for (const n of shown) {
                const file = (n.file || '?').replace(/^.*\//, '');
                lines.push(`- ${n.id || n.ID || '?'} [${n.kind || n.Kind || '?'}] (${file})`);
              }
              if (overflow > 0) lines.push(`… and ${overflow} more`);
              lines.push('```');
              lines.push('</details>');
              lines.push('');
            }

            // ── Changed edges ─────────────────────────────────────────────
            const MAX_EDGES = 20;
            if (edgesAdded.length || edgesRemoved.length) {
              lines.push('<details>');
              lines.push(`<summary><b>Edge changes (+${edgesAdded.length} / -${edgesRemoved.length})</b></summary>`);
              lines.push('');
              lines.push('```text');
              for (const e of edgesAdded.slice(0, MAX_EDGES)) {
                lines.push(`+ [${e.type || e.Type || '?'}] ${e.source_id || e.SourceID || '?'} → ${e.target_id || e.TargetID || '?'}`);
              }
              if (edgesAdded.length > MAX_EDGES) lines.push(`… and ${edgesAdded.length - MAX_EDGES} more added`);
              for (const e of edgesRemoved.slice(0, MAX_EDGES)) {
                lines.push(`- [${e.type || e.Type || '?'}] ${e.source_id || e.SourceID || '?'} → ${e.target_id || e.TargetID || '?'}`);
              }
              if (edgesRemoved.length > MAX_EDGES) lines.push(`… and ${edgesRemoved.length - MAX_EDGES} more removed`);
              lines.push('```');
              lines.push('</details>');
              lines.push('');
            }

            // ── Files with architectural impact ───────────────────────────
            if (files.length) {
              const shown = files.slice(0, 50);
              const overflow = files.length - shown.length;
              lines.push('<details>');
              lines.push(`<summary><b>📁 Files with architectural impact (${files.length})</b></summary>`);
              lines.push('');
              for (const f of shown) lines.push(`- \`${f}\``);
              if (overflow > 0) lines.push(`… and ${overflow} more`);
              lines.push('</details>');
              lines.push('');
            }

            lines.push('---');
            lines.push('*Generated by [GlassMarble](https://github.com/Syamchand123/GlassMarble) · `gmb compare`*');

            const body = lines.join('\n');

            // ── Upsert comment ────────────────────────────────────────────
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const prior = comments.find(c => c.body && c.body.includes(MARKER));

            if (prior) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: prior.id,
                body,
              });
              console.log(`Updated existing AKG diff comment (id: ${prior.id})`);
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('Created new AKG diff comment');
            }
