name: GlassMarble Docs Intelligence Check

on:
  pull_request:
    branches: [main]

jobs:
  doc-check:
    name: Check Living Documentation Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build GlassMarble CLI
        run: go build -o bin/gmb .

      - name: Run GlassMarble doc check
        id: doccheck
        run: ./bin/gmb doc check --json > doc_check_report.json; echo "exit=$?" >> "$GITHUB_OUTPUT"; cat doc_check_report.json
        env:
          GLASSMARBLE_QUIET: "true"
          GLASSMARBLE_ANTHROPIC_API_KEY: ${{ secrets.GLASSMARBLE_API_KEY }}

      - name: Post doc status comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'GlassMarble doc check failed: documentation drift detected. Run `gmb doc` locally to sync.';
            try {
              const raw = fs.readFileSync('doc_check_report.json', 'utf8');
              body = 'GlassMarble doc drift report:\n\n```json\n' + raw.slice(0, 60000) + '\n```\n\nFix: run `gmb doc` to sync, then re-push.';
            } catch (e) {}
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload Drift Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmb-doc-report
          path: doc_check_report.json
