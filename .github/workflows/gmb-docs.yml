name: GlassMarble Docs Intelligence Check

on:
  pull_request:
    branches: [main, dev, "release/*"]
  push:
    branches: ["feature/*"]
  workflow_dispatch:
    inputs:
      auto_update:
        description: 'Mode B: run `gmb doc --write` and push the synced docs'
        required: false
        default: false
        type: boolean

jobs:
  doc-check:
    name: Check Living Documentation Drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build GlassMarble CLI
        run: go build -o bin/gmb .

      - name: Run GlassMarble doc check
        id: doccheck
        run: |
          set +e
          ./bin/gmb doc check --json > doc_check_report.json
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          cat doc_check_report.json
          # Mode C strict gate: drift (exit 1) or hard error (exit 2) fails the job.
          exit $code
        env:
          GLASSMARBLE_QUIET: "true"
          GLASSMARBLE_ANTHROPIC_API_KEY: ${{ secrets.GLASSMARBLE_API_KEY }}

      - name: Run GlassMarble doc diff preview
        id: docdiff
        if: always()
        run: |
          set +e
          ./bin/gmb doc diff > diff_preview.txt
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          cat diff_preview.txt
          # The preview must never fail the job; the check step above is the gate.
          exit 0
        env:
          GLASSMARBLE_QUIET: "true"
          GLASSMARBLE_ANTHROPIC_API_KEY: ${{ secrets.GLASSMARBLE_API_KEY }}

      - name: Post doc status comment (Mode A)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'GlassMarble doc check failed: documentation drift detected. Run `gmb doc` locally to sync.';
            try {
              const raw = fs.readFileSync('doc_check_report.json', 'utf8');
              body = 'GlassMarble doc drift report:\n\n```json\n' + raw.slice(0, 60000) + '\n```\n\nFix: run `gmb doc` to sync, then re-push.';
            } catch (e) {}
            // Embed the truncated `gmb doc diff` preview when available.
            try {
              const diff = fs.readFileSync('diff_preview.txt', 'utf8');
              if (diff.trim().length > 0) {
                body += '\n\n<details><summary>Diff preview (<code>gmb doc diff</code>, truncated)</summary>\n\n```diff\n' + diff.slice(0, 20000) + '\n```\n</details>';
              }
            } catch (e) {}
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload Drift Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmb-doc-report
          path: doc_check_report.json

      - name: Upload Diff Preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmb-doc-diff-preview
          path: diff_preview.txt
          if-no-files-found: warn

  doc-auto-update:
    name: Auto-sync Living Documentation (Mode B)
    if: github.event_name == 'workflow_dispatch' && inputs.auto_update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build GlassMarble CLI
        run: go build -o bin/gmb .

      - name: Require LLM secret for auto-update
        env:
          GM_API_KEY: ${{ secrets.GLASSMARBLE_API_KEY }}
        run: |
          if [ -z "$GM_API_KEY" ]; then
            echo "::error::The GLASSMARBLE_API_KEY repository secret is required for doc auto-update (gmb doc --write). Configure it under Settings > Secrets and variables > Actions, or use the read-only drift check instead."
            exit 1
          fi

      - name: Sync living documentation
        run: ./bin/gmb doc --write
        env:
          GLASSMARBLE_QUIET: "true"
          GLASSMARBLE_ANTHROPIC_API_KEY: ${{ secrets.GLASSMARBLE_API_KEY }}

      - name: Commit and push synced docs (Mode B)
        run: |
          git config user.name "glassmarble-docs[bot]"
          git config user.email "glassmarble-docs[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore(docs): sync living documentation"
            git push
          else
            echo "docs already in sync; nothing to commit"
          fi
