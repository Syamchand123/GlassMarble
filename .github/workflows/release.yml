name: Release GlassMarble

# Updated for v1.2.0:
#  - Native linux/arm64 and windows/arm64 builds added to the matrix.
#  - Preflight now runs the FULL `go test ./...` suite before publishing.
#  - Release must be triggered by a version tag (no v1.0.0 fallback).
#  - Cosign emits checksums.txt.pem alongside checksums.txt.sig.
#  - docs/man is the single canonical man tree; completions are regenerated.
#  - Release notes are extracted from the tag's CHANGELOG section.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Golden parity gate
        run: go test ./internal/visualization_engine/render -run TestGoldenParity -count=1 -v

      - name: Determinism gate
        run: go test ./internal/akg -run TestGraphJSONDeterministic -count=1 -v

      - name: Visualization sanitizer gate (python stress)
        run: go test ./tests/qa -run TestVisualizationStressPythonClass -count=1 -v

      # The release must not publish unless the same full suite CI runs is
      # green on the tagged commit — otherwise a tag could ship while the
      # separate ci.yml run is still in flight (or red).
      - name: Full test suite (no -short)
        run: go test ./... -count=1 -timeout 30m

  matrix-build:
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            bin: gmb
            alias: glassmarble
            archive_format: tar.gz
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            bin: gmb
            alias: glassmarble
            archive_format: tar.gz
          - runner: macos-latest
            os: darwin
            arch: amd64
            bin: gmb
            alias: glassmarble
            archive_format: tar.gz
          - runner: macos-latest
            os: darwin
            arch: arm64
            bin: gmb
            alias: glassmarble
            archive_format: tar.gz
          - runner: windows-latest
            os: windows
            arch: amd64
            bin: gmb.exe
            alias: glassmarble.exe
            archive_format: zip
          - runner: windows-11-arm
            os: windows
            arch: arm64
            bin: gmb.exe
            alias: glassmarble.exe
            archive_format: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract Release Tag & Metadata
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            echo "::error::Release must be triggered by a version tag (refs/tags/vX.Y.Z); got GITHUB_REF=$GITHUB_REF. Tag the commit first: git tag -a v1.2.0 -m 'Release v1.2.0' && git push origin v1.2.0"
            exit 1
          fi
          CLEAN_VER="${TAG#v}"
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo 'dev')"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "clean_ver=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Generate Man Pages & Shell Completions
        shell: bash
        run: |
          # docs/man is the single canonical, CI-gated man tree.
          go run ./cmd/man -o docs/man
          go run ./cmd/completions -o completions

      - name: Compile Native Binary (${{ matrix.os }}/${{ matrix.arch }})
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          LDFLAGS="-s -w -X github.com/Syamchand123/GlassMarble/internal/product.Version=${{ steps.meta.outputs.tag }} -X github.com/Syamchand123/GlassMarble/internal/product.Commit=${{ steps.meta.outputs.commit }} -X github.com/Syamchand123/GlassMarble/internal/product.Date=${{ steps.meta.outputs.date }} -X github.com/Syamchand123/GlassMarble/internal/product.BuiltBy=github-actions"
          
          if [ "${{ matrix.os }}" = "darwin" ] && [ "${{ matrix.arch }}" = "amd64" ]; then
            export CGO_CFLAGS="-target x86_64-apple-darwin"
            export CGO_LDFLAGS="-target x86_64-apple-darwin"
          fi

          go build -trimpath -ldflags "$LDFLAGS" -o "${{ matrix.bin }}" .
          go build -trimpath -ldflags "$LDFLAGS" -o "${{ matrix.alias }}" .

      - name: Package Archive (${{ matrix.archive_format }})
        shell: bash
        run: |
          ARCHIVE_DIR="gmb_${{ steps.meta.outputs.clean_ver }}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "$ARCHIVE_DIR"
          cp "${{ matrix.bin }}" "$ARCHIVE_DIR/"
          cp "${{ matrix.alias }}" "$ARCHIVE_DIR/"
          cp LICENSE README.md CHANGELOG.md "$ARCHIVE_DIR/"
          cp -r docs/man "$ARCHIVE_DIR/man"
          cp -r completions "$ARCHIVE_DIR/"
          mkdir -p dist
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            cd "$ARCHIVE_DIR"
            7z a -r "../dist/${ARCHIVE_DIR}.zip" .
            cd ..
          else
            tar -czf "dist/${ARCHIVE_DIR}.tar.gz" -C "$ARCHIVE_DIR" .
          fi

      - name: Upload Packaged Archive
        uses: actions/upload-artifact@v4
        with:
          name: archive_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release & Signatures
    needs: matrix-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all packaged archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: archive_*
          merge-multiple: true

      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign Checksums with Cosign
        shell: bash
        run: |
          # Emit BOTH the signature and the keyless certificate so the
          # documented `cosign verify-blob --certificate` flow works.
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.18.0

      - name: Generate Syft SBOMs
        shell: bash
        run: |
          for f in dist/*.tar.gz dist/*.zip; do
            if [ -f "$f" ]; then
              syft "$f" -o spdx-json="dist/$(basename "$f").sbom.spdx.json"
            fi
          done

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        if: success()
        with:
          subject-path: "dist/*"

      - name: Publish GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            echo "::error::Release must be triggered by a version tag; got GITHUB_REF=$GITHUB_REF"
            exit 1
          fi
          # Release notes are the CHANGELOG section for THIS tag only, not
          # the entire historical changelog.
          NOTES="release-notes.md"
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { grab=1; print; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo "::warning::No CHANGELOG section found for $TAG; falling back to the full changelog"
            cp CHANGELOG.md "$NOTES"
          fi
          gh release create "$TAG" dist/* \
            --title "GlassMarble $TAG" \
            --notes-file "$NOTES" \
            --verify-tag
