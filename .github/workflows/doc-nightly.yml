# ─────────────────────────────────────────────────────────────────────────────
# GlassMarble doc-engine nightly: fuzzing, mutation/behavior gates, benchmarks
#
# Gaps A5d (fuzz corpus), C4 (mutation/behavior gates), C5 (bench smoke):
# runs the doc-engine fuzz targets, the verifier gate/mutation suite, and a
# benchmark smoke pass on a nightly schedule (plus manual dispatch).
#
# Fuzz steps must fail loudly on crashers (no `|| true`): a fuzz failure
# exits non-zero by default, which is exactly the signal this workflow gates
# on.
# ─────────────────────────────────────────────────────────────────────────────

name: doc-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz doc-engine (60s each)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz section merger
        run: go test -fuzz=FuzzMergeSection -fuzztime=60s ./internal/doc_engine/patcher/

      - name: Fuzz grounding sanitizer
        run: go test -fuzz=FuzzSanitize -fuzztime=60s ./internal/doc_engine/grounding/

      - name: Fuzz snippet extractor
        run: go test -fuzz=FuzzSnippetExtract -fuzztime=60s ./internal/doc_engine/devex/

  gates:
    name: Mutation and behavior gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Mutation and gate tests
        run: go test -run 'TestMutation|TestGate|TestRunGates' -count=1 ./internal/doc_engine/verifier/

  benchmarks:
    name: Benchmark smoke (no gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Benchmark smoke pass
        run: go test -bench=. -benchtime=100x -run=^$ ./internal/doc_engine/...
